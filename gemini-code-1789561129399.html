<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOR YOU KEYABETSWE 🥹🥹</title>
    <style>
        body {
            margin: 0;
            background-color: #0f0a14;
            color: white;
            font-family: 'SansSerif', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .content-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }
        .photo-frame {
            width: 180px;
            height: 180px;
            border-radius: 16px;
            background: rgba(255, 105, 130, 0.2);
            border: 4px solid white;
            box-shadow: 0 0 20px rgba(255, 105, 130, 0.5);
            display: none;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .message-box {
            opacity: 0;
            transition: opacity 1s ease-in-out;
            max-width: 600px;
            padding: 0 20px;
        }
        .message-box h1 {
            font-size: 24px;
            color: #ffebeb;
            margin: 10px 0;
        }
        .message-box p.date {
            font-size: 15px;
            color: #ffb4be;
            margin: 5px 0;
        }
        .message-box p.sentiment {
            font-size: 14px;
            color: #dc8cd2;
            margin: 5px 0;
        }
        .message-box p.special {
            font-size: 18px;
            font-weight: bold;
            font-style: italic;
            color: #ffd700;
            margin: 15px 0;
        }
        button {
            position: relative;
            z-index: 2;
            margin-top: 30px;
            background-color: #c81428;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(200, 20, 40, 0.4);
            transition: background 0.2s;
            pointer-events: auto;
        }
        button:hover {
            background-color: #e61e38;
        }
    </style>
</head>
<body>

    <canvas id="flowerCanvas"></canvas>

    <div class="content-container">
        <div class="photo-frame" id="photoFrame">
            <img id="slideshowImg" src="photo1.jpeg" alt="Memory">
        </div>

        <div class="message-box" id="messageBox">
            <h1>For You, Keyabetswe ❤️</h1>
            <p class="date">Since September 7th, when you agreed to be my girlfriend</p>
            <p class="sentiment">I honestly don't even know how to put into words how much you mean to me...</p>
            <p class="special">✨ Little things do matter ✨</p>
        </div>
    </div>

    <button id="actionBtn" onclick="triggerExplosion()">Press Me ❤️</button>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let t = 0;
        let exploded = false;
        let burst = [];
        let photos = ['photo1.jpeg', 'photo2.jpeg'];
        let currentPhotoIndex = 0;
        let slideshowInterval = null;

        class Petal {
            constructor(x, y, vx, vy, size, color, rotation) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.size = size;
                this.color = color;
                this.rotation = rotation;
                this.spin = (Math.random() - 0.5) * 0.1;
                this.life = 1.0;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05;
                this.vx *= 0.995;
                this.rotation += this.spin;
                this.life -= 0.003;
            }
        }

        function drawFlower(x, y, size, rotation, baseColor, alpha = 1.0) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y);
            ctx.rotate(rotation);

            let petals = 6;
            for (let i = 0; i < petals; i++) {
                ctx.rotate((Math.PI * 2) / petals);
                ctx.beginPath();
                ctx.ellipse(0, size * 0.4, size * 0.28, size * 0.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = baseColor;
                ctx.fill();
            }

            // Center
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.16, 0, Math.PI * 2);
            let gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.16);
            gradient.addColorStop(0, '#ffdc64');
            gradient.addColorStop(1, '#e6a01e');
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.restore();
        }

        function triggerExplosion() {
            const btn = document.getElementById('actionBtn');
            const msgBox = document.getElementById('messageBox');
            const photoFrame = document.getElementById('photoFrame');

            if (exploded) {
                // Reset
                exploded = false;
                burst = [];
                btn.innerText = "Press Me ❤️";
                msgBox.style.opacity = 0;
                photoFrame.style.display = 'none';
                clearInterval(slideshowInterval);
                return;
            }

            exploded = true;
            btn.innerText = "Press Again ❤️";

            let cx = window.innerWidth / 2;
            let cy = window.innerHeight / 2 - 120;

            let count = 50;
            let colors = ['#dc143c', '#ff6982', '#ff3c5a', '#ffb6c1', '#ff8c00'];

            for (let i = 0; i < count; i++) {
                let angle = (Math.PI * 2 * i / count) + (Math.random() - 0.5) * 0.3;
                let speed = 2 + Math.random() * 4;
                let vx = Math.cos(angle) * speed;
                let vy = Math.sin(angle) * speed;
                let color = colors[Math.floor(Math.random() * colors.length)];
                let size = 30 + Math.random() * 30;
                burst.push(new Petal(cx, cy, vx, vy, size, color, Math.random() * Math.PI));
            }

            setTimeout(() => {
                msgBox.style.opacity = 1;
                photoFrame.style.display = 'block';
            }, 600);

            slideshowInterval = setInterval(() => {
                currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
                document.getElementById('slideshowImg').src = photos[currentPhotoIndex];
            }, 3500);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let cx = window.innerWidth / 2;
            let cy = window.innerHeight / 2 - 120;

            if (!exploded) {
                t += 0.05;
                let pulse = 1.0 + 0.12 * Math.sin(t);
                drawFlower(cx, cy, 90 * pulse, t * 0.2, '#dc143c');
            } else {
                for (let i = burst.length - 1; i >= 0; i--) {
                    let p = burst[i];
                    p.update();
                    if (p.life <= 0) {
                        burst.splice(i, 1);
                    } else {
                        drawFlower(p.x, p.y, p.size, p.rotation, p.color, Math.max(0, p.life));
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
